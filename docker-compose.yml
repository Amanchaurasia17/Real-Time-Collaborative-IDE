version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - WS_PATH=/collab
      - YPERSISTENCE=./.yjs-data
    volumes:
      - server_data:/app/packages/server/.yjs-data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
